<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - TRUE-NESTER</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .blog-container {
            max-width: 1200px;
            margin: 100px auto 2rem;
            padding: 0 2rem;
        }

        .blog-container h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #333;
        }

        .blog-posts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .blog-post {
            background: #f9f9f9;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .blog-post h2 {
            color: #333;
            margin-bottom: 1rem;
        }

        .blog-post .date {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .blog-post p {
            color: #555;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">TRUE-NESTER</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="properties.html" class="nav-link">Properties</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="blog.html" class="nav-link active">Blog</a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link">Contact</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="blog-container">
            <h1>Blog</h1>
            <div class="blog-posts">
                <article class="blog-post">
                    <h2>Welcome to TRUE-NESTER Blog</h2>
                    <p class="date">November 21, 2025</p>
                    <p>Stay tuned for insights, tips, and updates about finding your perfect property with TRUE-NESTER.</p>
                </article>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
